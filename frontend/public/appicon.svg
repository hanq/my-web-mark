<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- My Web Mark app icon v2: centered isometric gallery cube + bookmark ribbon -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2440"/>
      <stop offset="1" stop-color="#0c1018"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.52">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6da3ff"/>
      <stop offset="1" stop-color="#4f8cff"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#3a6fe8"/>
    </linearGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a50a8"/>
      <stop offset="1" stop-color="#1e3c86"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc95e"/>
      <stop offset="1" stop-color="#f0a52e"/>
    </linearGradient>
    <clipPath id="plate"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <g clip-path="url(#plate)">
    <!-- 舞台光晕（呼应 2.5D 地板光斑） -->
    <rect width="1024" height="1024" fill="url(#halo)"/>
    <!-- 同心圆环：画廊地面意象 -->
    <circle cx="512" cy="700" r="330" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="26"/>
    <circle cx="512" cy="700" r="430" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="12"/>
  </g>

  <!-- 等轴立方体：视觉中心精确落在 (512,512) -->
  <polygon points="512,212 792,352 512,492 232,352" fill="url(#faceTop)"/>
  <polygon points="232,352 512,492 512,812 232,672" fill="url(#faceLeft)"/>
  <polygon points="512,492 792,352 792,672 512,812" fill="url(#faceRight)"/>
  <!-- 顶棱高光 -->
  <path d="M232,352 L512,212 L792,352" fill="none" stroke="#a9c6ff" stroke-opacity="0.8" stroke-width="3" stroke-linejoin="round"/>

  <!-- 书签丝带（贴右面，渐变立体） -->
  <path d="M603,557 L701,606 L701,711 L652,648 L603,662 Z" fill="url(#ribbon)"/>
</svg>
